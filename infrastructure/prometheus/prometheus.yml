global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # SeldonVigil API — OTel Prometheus exporter (meters "SeldonVigil.Api" + framework)
  - job_name: seldonvigil-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Redpanda — consumer-group lag + broker metrics
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
